[project]
name = "melee-llm"
version = "0.1.0"
description = "LLMs playing, coaching and writing bots for Super Smash Bros. Melee via libmelee"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.3.0",
    "melee>=0.47.6",
    "openai>=3.50.0",
    "pillow>=13.0.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
    "websockify>=0.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702", "E731", "B023", "B905"]
