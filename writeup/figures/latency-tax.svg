<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-label="The latency tax: same model, untimed vs real time">
<title>The latency tax: same model, untimed vs real time</title>
<style>text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.bg{fill:#fcfcfb}.ring{stroke:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.tm{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.band{fill:#52514e;fill-opacity:.09}.conn{stroke:#c3c2b7}.c-learned{fill:#2a78d6;stroke:#2a78d6}.c-coach{fill:#eb6834;stroke:#eb6834}.c-written{fill:#1baf7a;stroke:#1baf7a}.c-llm{fill:#eda100;stroke:#eda100}.c-jev{fill:#e87ba4;stroke:#e87ba4}.c-ref{fill:#898781;stroke:#898781}.ci{fill:none;stroke-width:2;stroke-linecap:round}.hollow{fill-opacity:0}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ring{stroke:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.tm{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.band{fill:#c3c2b7;fill-opacity:.10}.conn{stroke:#4a4a46}.c-learned{fill:#3987e5;stroke:#3987e5}.c-coach{fill:#d95926;stroke:#d95926}.c-written{fill:#199e70;stroke:#199e70}.c-llm{fill:#c98500;stroke:#c98500}.c-jev{fill:#d55181;stroke:#d55181}.c-ref{fill:#898781;stroke:#898781}}</style>
<rect class="bg" x="0" y="0" width="760" height="222" rx="8"/>
<text x="16.0" y="26.0" class="t1" font-size="15" text-anchor="start" font-weight="600">The latency tax: same model, untimed vs real time</text>
<text x="16.0" y="45.0" class="t2" font-size="12" text-anchor="start">Untimed: the game waits for every decision. Real time: 60 fps, never waits. 95% intervals are about ±110-145.</text>
